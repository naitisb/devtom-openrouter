[project]
name = "devtom-openrouter"
version = "0.1.0"
description = "Mapping LLMs to developmental ages using validated theory-of-mind tasks from developmental psychology."
authors = [{ name = "Naiti S. Bhatt" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
